name: Build APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Test core logic
        run: ./gradlew :core:test

      - name: Build APK
        run: ./gradlew :app:assembleDebug

      - name: Name APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/pareido-${{ github.run_number }}.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pareido-apk
          path: app/build/outputs/apk/debug/pareido-${{ github.run_number }}.apk

      # Every successful build of main is published as a release, so the APK
      # can be downloaded straight from the phone's browser.
      - name: Publish release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Pareido build ${{ github.run_number }}
          body: "Install `pareido-${{ github.run_number }}.apk` on your phone. Built from ${{ github.sha }}."
          files: app/build/outputs/apk/debug/pareido-${{ github.run_number }}.apk
